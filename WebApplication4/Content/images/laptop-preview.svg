<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <!-- Desk wood gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Screen code gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="previewShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Wooden / Modern Desk Surface Background -->
  <rect width="320" height="200" fill="#e2e8f0"/>
  <!-- Perspective Desk Texture -->
  <polygon points="0,60 320,60 320,200 0,200" fill="#d1d5db"/>

  <!-- Small Plant in white pot on top left -->
  <g transform="translate(30, 25)">
    <!-- Pot -->
    <polygon points="12,45 28,45 25,65 15,65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Leaves -->
    <path d="M 20 45 C 5 35 10 20 20 15 C 22 25 22 35 20 45 Z" fill="#22c55e"/>
    <path d="M 20 45 C 35 35 30 20 20 15 C 24 25 24 35 20 45 Z" fill="#16a34a"/>
    <path d="M 20 45 C 10 40 5 30 12 25 C 18 32 18 38 20 45 Z" fill="#4ade80"/>
    <path d="M 20 45 C 30 40 35 30 28 25 C 22 32 22 38 20 45 Z" fill="#15803d"/>
  </g>

  <!-- Laptop in angled perspective -->
  <g transform="translate(70, 45)" filter="url(#previewShadow)">
    <!-- Screen Shell -->
    <rect x="15" y="5" width="160" height="95" rx="5" fill="#334155"/>
    <rect x="20" y="10" width="150" height="85" rx="3" fill="url(#screenGrad)"/>
    
    <!-- Code Editor UI on Laptop Screen -->
    <!-- Tab bar -->
    <rect x="20" y="10" width="150" height="10" fill="#1e293b"/>
    <rect x="24" y="12" width="35" height="6" rx="1.5" fill="#3b82f6"/>
    <!-- Code lines -->
    <circle cx="25" cy="27" r="1.5" fill="#ef4444"/>
    <circle cx="29" cy="27" r="1.5" fill="#f59e0b"/>
    <circle cx="33" cy="27" r="1.5" fill="#10b981"/>

    <line x1="28" y1="36" x2="60" y2="36" stroke="#c084fc" stroke-width="2"/>
    <line x1="64" y1="36" x2="95" y2="36" stroke="#60a5fa" stroke-width="2"/>
    
    <line x1="36" y1="44" x2="75" y2="44" stroke="#38bdf8" stroke-width="2"/>
    <line x1="79" y1="44" x2="110" y2="44" stroke="#4ade80" stroke-width="2"/>

    <line x1="44" y1="52" x2="90" y2="52" stroke="#fcd34d" stroke-width="2"/>
    <line x1="94" y1="52" x2="135" y2="52" stroke="#94a3b8" stroke-width="2"/>

    <line x1="44" y1="60" x2="80" y2="60" stroke="#f472b6" stroke-width="2"/>
    <line x1="84" y1="60" x2="120" y2="60" stroke="#60a5fa" stroke-width="2"/>

    <line x1="36" y1="68" x2="65" y2="68" stroke="#38bdf8" stroke-width="2"/>
    <line x1="28" y1="76" x2="48" y2="76" stroke="#c084fc" stroke-width="2"/>

    <!-- Laptop Base / Keyboard -->
    <polygon points="5,100 185,100 205,142 -15,142" fill="#94a3b8"/>
    <polygon points="8,102 182,102 201,140 -11,140" fill="#cbd5e1"/>
    
    <!-- Keyboard Area -->
    <polygon points="20,105 170,105 180,126 10,126" fill="#1e293b"/>
    <!-- Keys simulation -->
    <line x1="18" y1="110" x2="172" y2="110" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 2"/>
    <line x1="16" y1="115" x2="174" y2="115" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 2"/>
    <line x1="14" y1="120" x2="176" y2="120" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 3"/>

    <!-- Trackpad -->
    <rect x="75" y="128" width="40" height="10" rx="1.5" fill="#94a3b8" stroke="#64748b" stroke-width="0.5"/>
  </g>

  <!-- Cup of Coffee on the right -->
  <g transform="translate(265, 115)">
    <!-- Saucer -->
    <ellipse cx="20" cy="30" rx="18" ry="6" fill="#cbd5e1"/>
    <!-- Cup -->
    <ellipse cx="20" cy="22" rx="12" ry="4" fill="#334155"/>
    <path d="M 8 22 C 8 32 14 36 20 36 C 26 36 32 32 32 22 Z" fill="#f8fafc"/>
    <ellipse cx="20" cy="22" rx="10" ry="3" fill="#78350f"/>
    <!-- Handle -->
    <path d="M 32 24 C 36 24 36 30 32 31" stroke="#f8fafc" stroke-width="2" fill="none"/>
  </g>
</svg>
