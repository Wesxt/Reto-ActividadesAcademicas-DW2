<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient circles -->
  <circle cx="380" cy="100" r="95" fill="url(#bgGlow)"/>
  <circle cx="160" cy="80" r="75" fill="#f1f5f9" opacity="0.6"/>
  <circle cx="280" cy="60" r="60" fill="#e0f2fe" opacity="0.5"/>

  <!-- Decorative floating academic symbols -->
  <path d="M 430 40 L 440 35 L 450 40 L 440 45 Z" fill="#93c5fd" opacity="0.7"/>
  <path d="M 60 50 L 70 45 L 80 50 L 70 55 Z" fill="#fed7aa" opacity="0.7"/>
  <circle cx="450" cy="140" r="4" fill="#60a5fa" opacity="0.5"/>
  <circle cx="50" cy="110" r="3" fill="#34d399" opacity="0.5"/>

  <!-- STUDENT 1 (Left - Blue Hoodie & Laptop) -->
  <g transform="translate(40, 20)">
    <!-- Body / Blue Hoodie -->
    <path d="M 40 180 C 40 135 60 115 95 110 C 130 115 150 135 150 180 Z" fill="#2563eb"/>
    <path d="M 80 110 L 95 140 L 110 110 Z" fill="#1d4ed8"/>
    <!-- Head -->
    <circle cx="95" cy="70" r="28" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 67 65 C 67 35 123 35 123 65 C 115 50 100 46 95 46 C 85 46 75 52 67 65 Z" fill="#1e293b"/>
    <!-- Face details -->
    <!-- Eyes -->
    <circle cx="85" cy="68" r="3" fill="#0f172a"/>
    <circle cx="105" cy="68" r="3" fill="#0f172a"/>
    <!-- Glasses -->
    <rect x="77" y="62" width="16" height="12" rx="3" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="97" y="62" width="16" height="12" rx="3" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="93" y1="68" x2="97" y2="68" stroke="#0f172a" stroke-width="2"/>
    <!-- Smile -->
    <path d="M 89 78 Q 95 83 101 78" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Laptop -->
    <rect x="65" y="145" width="60" height="35" rx="3" fill="#334155" filter="url(#softShadow)"/>
    <polygon points="65,145 125,145 140,165 50,165" fill="#475569"/>
    <circle cx="95" cy="155" r="4" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- STUDENT 2 (Center - Orange Top & Notebook) -->
  <g transform="translate(180, 15)">
    <!-- Hair back -->
    <path d="M 70 70 C 60 90 60 140 75 160 C 85 140 85 100 85 70 Z" fill="#0f172a"/>
    <path d="M 125 70 C 135 90 135 140 120 160 C 110 140 110 100 110 70 Z" fill="#0f172a"/>
    <!-- Body / Orange Top -->
    <path d="M 45 185 C 45 140 65 120 97 118 C 130 120 150 140 150 185 Z" fill="#f97316"/>
    <!-- Neck -->
    <rect x="89" y="95" width="18" height="25" fill="#fed7aa"/>
    <!-- Head -->
    <circle cx="97" cy="68" r="27" fill="#fcd34d"/>
    <!-- Hair front -->
    <path d="M 70 65 C 70 30 125 30 125 65 C 110 45 85 45 70 65 Z" fill="#1e293b"/>
    <!-- Eyes -->
    <circle cx="89" cy="66" r="3" fill="#0f172a"/>
    <circle cx="107" cy="66" r="3" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M 91 76 Q 98 83 105 76" stroke="#c2410c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Blue Notebook in hand -->
    <rect x="80" y="140" width="36" height="42" rx="3" fill="#3b82f6" transform="rotate(-10 98 161)" filter="url(#softShadow)"/>
    <line x1="84" y1="148" x2="108" y2="144" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="85" y1="154" x2="109" y2="150" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- STUDENT 3 (Right - Green Hoodie & Glasses) -->
  <g transform="translate(305, 12)">
    <!-- Backpack strap -->
    <path d="M 65 135 Q 55 160 60 185" stroke="#0f172a" stroke-width="6" fill="none"/>
    <!-- Body / Green Hoodie -->
    <path d="M 45 185 C 45 138 65 116 97 114 C 130 116 150 138 150 185 Z" fill="#16a34a"/>
    <path d="M 82 114 L 97 142 L 112 114 Z" fill="#15803d"/>
    <!-- Head -->
    <circle cx="97" cy="66" r="28" fill="#fed7aa"/>
    <!-- Short Curly Hair -->
    <path d="M 68 62 C 68 32 126 32 126 62 C 120 48 105 44 97 44 C 85 44 75 48 68 62 Z" fill="#334155"/>
    <circle cx="78" cy="46" r="8" fill="#334155"/>
    <circle cx="95" cy="42" r="9" fill="#334155"/>
    <circle cx="114" cy="46" r="8" fill="#334155"/>
    <!-- Face details -->
    <!-- Eyes -->
    <circle cx="87" cy="65" r="3" fill="#0f172a"/>
    <circle cx="107" cy="65" r="3" fill="#0f172a"/>
    <!-- Glasses -->
    <circle cx="87" cy="65" r="9" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="107" cy="65" r="9" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="96" y1="65" x2="98" y2="65" stroke="#0f172a" stroke-width="2"/>
    <!-- Smile -->
    <path d="M 91 76 Q 97 83 103 76" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
